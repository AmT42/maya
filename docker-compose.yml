networks:
  net:
    driver: bridge

services:
  web:
    build: .
    ports:
      - "8000:80"
      - "4060:4060"
    volumes:
      - ./app/storage:/app/storage
      - ./app/core:/app/core 
    # volumes:
    #   - ./app:/app
    depends_on:
      - db
    networks:
      - net
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/maya_db
      MAYA_DEV_MODE: ${MAYA_DEV_MODE:-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL_DOC: ${OPENROUTER_MODEL_DOC:-google/gemini-3-flash-preview}
      OPENROUTER_MODEL_CHAT: ${OPENROUTER_MODEL_CHAT:-google/gemini-3-flash-preview}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-true}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-Maya}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_SA_CREDENTIALS: ${GOOGLE_SA_CREDENTIALS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_ID: ${GOOGLE_ID:-}

  db:
    image: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: maya_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - net

  server:
    profiles: ["chroma"]
    image: ghcr.io/chroma-core/chroma:latest
    volumes:
      - index_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    ports:
      - 8001:8000
    networks:
      - net

volumes:
  pgdata:
  index_data:
    driver: local
  # storage:
